# String. Optional, default to 'postgres'. Database name.
database.name=james

# String. Optional, default to 'public'. Database schema.
database.schema=public

# String. Optional, default to '127.0.0.1'. Database host.
database.host=127.0.0.1

# Integer. Optional, default to 5432. Database port.
database.port=5432

# String. Required. Database username.
database.username=james

# String. Required. Database password of the user.
database.password=secret1

# Boolean. Optional, default to false. Whether to enable row level security.
row.level.security.enabled=false

# Integer. Database connection pool initial size (прогрет сразу до 48 соединений для предотвращения задержек аллокации при burst-нагрузке).
pool.initial.size=48
pool.max.size=64

# By-pass-rls connection pool linked directly to Netty event loop threads (32)
by-pass-rls.pool.initial.size=24
by-pass-rls.pool.max.size=24

# String. Optional, defaults to allow. SSLMode required to connect to the Postgresql db server.
ssl.mode=disable

## Duration. Optional, defaults to 10 second. jOOQ reactive timeout when executing Postgres query.
jooq.reactive.timeout=10second

# Integer. Кэш prepared statements в R2DBC пуле (LRU, ~500 типовых запросов James).
# Снижает CPU PostgreSQL на однотипных INSERT/SELECT при высоком throughput.
pool.statement.cache.size=2048












# ==============================================================================
# Apache James - IMAP Batch Fetching Configuration
# Controls how many messages are retrieved in single batch operations from Postgres/S3
# Increases client responsiveness and avoids single-row query storms
# ==============================================================================

# IMAP FETCH command batching (оптимизировано под ящики до 100 000+ сообщений)
fetch.metadata=2000
fetch.headers=1000
fetch.body=250
fetch.full=100

# IMAP COPY / MOVE batching
copy=500
move=500

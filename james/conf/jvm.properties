# ============================================= Extra JVM System Properties ===========================================
# To avoid clutter on the command line, any properties in this file will be added as system properties on server start.

# Example: If you need an option -Dmy.property=whatever, you can instead add it here as
# my.property=whatever

# Увеличиваем буфер памяти для обработки писем, чтобы мелкие операции не дергали HDD:
james.message.memory.threshold=45MiB
james.message.usememorycopy=true

# Оптимизация размера пачки для PostgreSQL/jOOQ при чтении списков писем (для ящиков до 100 000+ писем):
james.postgresql.query.batch.size=10000
query.batch.size=10000

# ActiveMQ Embedded storage limits and memory buffer tuning:
james.activemq.store.usage.limit.bytes=10737418240
james.activemq.temp.usage.limit.bytes=5368709120
org.apache.activemq.broker.region.Queue.cursorMemoryHighWaterMark=70
org.apache.activemq.UseDedicatedTaskRunner=false